name: Runner probe

on:
  push:
    paths:
      - .github/workflows/probe.yml
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Environment
        run: |
          sw_vers
          echo "--- Xcodes"
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          echo "--- iOS runtimes"
          xcrun simctl list runtimes | grep -i ios || true
          echo "--- iPhone devices"
          xcrun simctl list devices available | grep -i iphone | head -20 || true
          echo "--- tools"
          which xcodegen || echo "no xcodegen"
          brew --version | head -1

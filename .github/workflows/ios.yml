name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run parser, catalog and planner tests
        run: swift test

  app:
    name: Build, test & screenshots (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVICE: iPhone 17 Pro
      BUNDLE_ID: com.pinscape.app
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in data if "iOS" in k), key=lambda k: [int(p) for p in k.split("iOS-")[1].split("-")])
          for runtime in reversed(runtimes):
              for device in data[runtime]:
                  if device["name"] == os.environ["DEVICE"]:
                      print(device["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using $DEVICE ($UDID)"

      # xcodebuild's own exit status decides each step (pipefail through tee); -quiet keeps the log to
      # warnings and errors, and the full logs are uploaded if anything fails. A test that hangs fails
      # after a couple of minutes instead of the job timing out.
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pinscape.xcodeproj \
            -scheme Pinscape \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Unit tests (core logic, persistence, arrivals, capture)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pinscape.xcodeproj \
            -scheme Pinscape \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Summarise failures
        if: failure()
        run: |
          grep -hE "error:|failed" build.log test.log 2>/dev/null | sort -u | head -150 || true
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult | python3 scripts/test_failures.py
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore

      - name: Screenshots
        timeout-minutes: 15
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "Pinscape.app" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork 5g || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl location "$UDID" set 51.5316,-0.1236 || true
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE_ID" || true
          mkdir -p shots
          shoot() {
            name=$1; screen=$2; shift 2
            echo "$(date +%T) $name"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -PinscapeDemo YES -PinscapeScreen "$screen" -AppleLocale en_GB -AppleLanguages "(en-GB)" "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          xcrun simctl ui "$UDID" appearance light
          for screen in home capture capture-empty pin places here map settings onboarding; do
            shoot "$screen" "$screen"
          done
          shoot home-first-pin home -PinscapeFirstPin YES
          shoot map-branches map -PinscapeAllBranches YES
          xcrun simctl ui "$UDID" appearance dark
          shoot home-dark home
          shoot pin-dark pin
          ls -la shots

      - name: Package simulator build
        if: success()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "Pinscape.app" | head -1)
          ditto -c -k --keepParent "$APP" Pinscape-simulator.zip

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pinscape-simulator
          path: Pinscape-simulator.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinscape-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Publish screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          cd shots
          git init -q -b ci/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots

  release:
    name: Release archive & IPA (device)
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Archive all three targets for iOS devices
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pinscape.xcodeproj \
            -scheme Pinscape \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Pinscape.xcarchive \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee archive.log

      - name: Check the archive's contents
        run: |
          APP=build/Pinscape.xcarchive/Products/Applications/Pinscape.app
          for item in PlugIns/PinscapeWidgets.appex PlugIns/PinscapeShare.appex PinDrop.wav PrivacyInfo.xcprivacy Assets.car; do
            test -e "$APP/$item" || { echo "::error::Missing from archive: $item"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"
          echo "Archive contains the app, both extensions and their resources."

      # An IPA for sideloading tools (AltStore, SideStore, Sideloadly), which re-sign it with your
      # Apple ID. Each bundle gets an ad-hoc signature carrying its entitlements, so those tools can
      # see the App Group the app and its extensions share and register it for you.
      - name: Package IPA
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/Pinscape.xcarchive/Products/Applications/Pinscape.app ipa/Payload/
          APP=ipa/Payload/Pinscape.app
          sign() {
            local entitlements="$RUNNER_TEMP/$(basename "$2")"
            python3 -c 'import sys; print(open(sys.argv[1]).read().replace("$(PINSCAPE_APP_GROUP)", "group.com.pinscape.app"), end="")' "$2" > "$entitlements"
            if grep -q '\$(' "$entitlements"; then echo "::error::Unexpanded setting in $2"; exit 1; fi
            codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements "$entitlements" "$1"
          }
          for framework in "$APP"/Frameworks/*; do
            if [ -e "$framework" ]; then codesign --force --sign - --timestamp=none "$framework"; fi
          done
          sign "$APP/PlugIns/PinscapeWidgets.appex" PinscapeWidgets/Supporting/PinscapeWidgets.entitlements
          sign "$APP/PlugIns/PinscapeShare.appex" PinscapeShare/Supporting/PinscapeShare.entitlements
          sign "$APP" Pinscape/Supporting/Pinscape.entitlements
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP"
          (cd ipa && zip -qry ../Pinscape.ipa Payload)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          unzip -l Pinscape.ipa | tail -1
          ls -lh Pinscape.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pinscape-ipa
          path: Pinscape.ipa

      - name: Publish IPA branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir dist && cp Pinscape.ipa dist/
          printf '# Pinscape %s (build %s)\n\nBuilt from %s. Not signed for distribution: install it with AltStore, SideStore or Sideloadly, which sign it with your Apple ID. See the README.\n' "$VERSION" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > dist/README.md
          cd dist
          git init -q -b ci/ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Pinscape $VERSION ($GITHUB_RUN_NUMBER) from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/ipa

      - name: Summarise failures
        if: failure()
        run: grep -hE "error:" archive.log 2>/dev/null | sort -u | head -150 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: archive-log
          path: archive.log
          if-no-files-found: ignore

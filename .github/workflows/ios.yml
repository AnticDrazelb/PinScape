name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run parser, catalog and planner tests
        run: swift test

  app:
    name: Build, test & screenshots (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVICE: iPhone 17 Pro
      BUNDLE_ID: com.pinscape.app
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in data if "iOS" in k), key=lambda k: [int(p) for p in k.split("iOS-")[1].split("-")])
          for runtime in reversed(runtimes):
              for device in data[runtime]:
                  if device["name"] == os.environ["DEVICE"]:
                      print(device["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using $DEVICE ($UDID)"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pinscape.xcodeproj \
            -scheme Pinscape \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "(error|warning: unre|BUILD)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -150 || true

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pinscape.xcodeproj \
            -scheme Pinscape \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "(error:|Test Case .* failed|Executed|TEST)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Screenshots
        timeout-minutes: 15
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "Pinscape.app" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork 5g || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl location "$UDID" set 51.5316,-0.1236 || true
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE_ID" || true
          mkdir -p shots
          shoot() {
            name=$1; screen=$2; shift 2
            echo "$(date +%T) $name"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -PinscapeDemo YES -PinscapeScreen "$screen" -AppleLocale en_GB -AppleLanguages "(en-GB)" "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          xcrun simctl ui "$UDID" appearance light
          for screen in home capture capture-empty pin places here map settings onboarding; do
            shoot "$screen" "$screen"
          done
          shoot paywall paywall -PinscapeFree YES
          shoot home-first-pin home -PinscapeFirstPin YES
          xcrun simctl ui "$UDID" appearance dark
          shoot home-dark home
          shoot pin-dark pin
          ls -la shots

      - name: Package simulator build
        if: success()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "Pinscape.app" | head -1)
          ditto -c -k --keepParent "$APP" Pinscape-simulator.zip

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pinscape-simulator
          path: Pinscape-simulator.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinscape-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Publish screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          cd shots
          git init -q -b ci/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots
